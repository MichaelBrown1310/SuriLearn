<script>
  (function() {
    // Password toggle interaction
    const togglePassBtn = document.getElementById('toggle-password');
    const passInput = document.getElementById('reg-pass');
    
    if (togglePassBtn && passInput) {
      togglePassBtn.addEventListener('click', function() {
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        const icon = togglePassBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        }
      });
    }

    // Daily Goal Interactive Selector
    const goalLabels = document.querySelectorAll('.goal-option');
    goalLabels.forEach(label => {
      label.addEventListener('click', function() {
        // Clear active styles
        goalLabels.forEach(l => {
          l.classList.remove('bg-surface-container-low/90', 'ring-2', 'ring-primary-container');
          const radio = l.querySelector('input[type="radio"]');
          if (radio) radio.checked = false;
          const indicator = l.querySelector('.radio-indicator');
          if (indicator) {
            indicator.classList.remove('bg-primary-container', 'text-on-primary');
            indicator.classList.add('bg-surface-container');
            const check = indicator.querySelector('.material-symbols-outlined');
            if (check) check.classList.add('hidden');
          }
        });

        // Set active style on current
        label.classList.add('bg-surface-container-low/90', 'ring-2', 'ring-primary-container');
        const activeRadio = label.querySelector('input[type="radio"]');
        if (activeRadio) activeRadio.checked = true;

        const activeIndicator = label.querySelector('.radio-indicator');
        if (activeIndicator) {
          activeIndicator.classList.remove('bg-surface-container');
          activeIndicator.classList.add('bg-primary-container', 'text-on-primary');
          const check = activeIndicator.querySelector('.material-symbols-outlined');
          if (check) check.classList.remove('hidden');
        }
      });
    });

    // Button feedback delight
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span><span>Preparando centinela...</span>';
        setTimeout(() => {
          this.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>¡Listo para vigilar!</span>';
          this.classList.remove('bg-primary-container');
          this.classList.add('bg-tertiary');
        }, 800);
      });
    }
  })();
</script></main>
